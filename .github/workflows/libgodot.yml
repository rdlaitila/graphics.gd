name: libgodot

# Manual runs (workflow_dispatch) build the matrix and upload every
# artefact as a run artifact for inspection. Tag pushes like
# `libgodot-v4.7-stable-1` also build the matrix and additionally
# publish everything to a GitHub Release the toolchain catalog can
# point at from ToolchainLibGodot.DownloadURL.
#
# The matrix itself is generated by `gdnext ci libgodot-matrix` from
# product.LibGodotMatrix — adding a recipe there lands in CI with zero
# workflow edits. Filters (--filter-target, --filter-libc, editor/
# template only) let workflow_dispatch runs iterate on subsets.
on:
  workflow_dispatch:
    inputs:
      filter-target:
        description: "Comma-separated goos/goarch to build (empty = all)"
        required: false
        default: ""
      filter-libc:
        description: "Comma-separated libc variants glibc,musl (empty = both)"
        required: false
        default: ""
      variant:
        description: "Which variant(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - template
          - editor
  push:
    tags:
      - "libgodot-v*"

concurrency:
  group: libgodot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
      runners: ${{ steps.gen.outputs.runners }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - id: gen
        name: Emit libgodot matrix
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.filter-target }}" ]; then
            args+=(--filter-target "${{ inputs.filter-target }}")
          fi
          if [ -n "${{ inputs.filter-libc }}" ]; then
            args+=(--filter-libc "${{ inputs.filter-libc }}")
          fi
          case "${{ inputs.variant }}" in
            editor)   args+=(--editor-only) ;;
            template) args+=(--template-only) ;;
          esac
          matrix_json=$(gdnext ci libgodot-matrix --summary "${args[@]}" 2>matrix.log)
          cat matrix.log >&2
          echo "include=$(echo "$matrix_json" | jq -c '.include')" >> $GITHUB_OUTPUT
          # Distinct runner labels so the bootstrap job can prime
          # ~/gd once per host before the build fan-out. Each cell
          # in `include` carries its own `runner` field.
          runners=$(echo "$matrix_json" | jq -c '[.include[].runner] | unique | map({runner: .})')
          echo "runners=${runners}" >> $GITHUB_OUTPUT

  # Prime ~/gd on each distinct runner once so the parallel build
  # fan-out below restores from cache instead of every cell racing to
  # download zig + scons + buildroot SDK independently. Cache key
  # matches gdnext.yml so both workflows share cache slots on the
  # same runner.
  bootstrap:
    name: Prime ~/gd (${{ matrix.runner }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.runners) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - id: tools-key
        shell: bash
        run: |
          digest=$(gdnext toolchain list --format json | sha256sum | cut -c1-12)
          echo "key=${{ runner.os }}-${{ runner.arch }}-gdnext-tools-${digest}" >> $GITHUB_OUTPUT
          echo "prefix=${{ runner.os }}-${{ runner.arch }}-gdnext-tools-" >> $GITHUB_OUTPUT
      - name: Restore ~/gd (catalog digest)
        id: restore-tools
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ steps.tools-key.outputs.key }}
          restore-keys: |
            ${{ steps.tools-key.outputs.prefix }}
      - name: Install zig (required for musl / windows-mingw)
        shell: bash
        run: gdnext toolchain install zig
      - name: Prime godot source tarball
        shell: bash
        # Every libgodot cell extracts the same Godot source zip
        # (~200MB) under ~/gd/godot-src/<ref>. Priming once here means
        # the fan-out below restores from ~/gd instead of each cell
        # re-downloading + re-extracting. Host-agnostic tarball, so
        # this runs on every bootstrap runner.
        run: gdnext toolchain install godot-src
      - name: Prime buildroot SDK (linux runners only)
        if: runner.os == 'Linux'
        shell: bash
        # The glibc libgodot recipes fetch the ~120MB buildroot SDK on
        # demand; priming it here means the 8 linux cells in the build
        # fan-out restore it from ~/gd instead of each racing to
        # download the same tarball. Only linux runners consume the
        # buildroot SDK (macOS + windows targets link differently).
        run: gdnext toolchain install godot-buildroot
      - name: Save ~/gd
        if: steps.restore-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ steps.tools-key.outputs.key }}

  build:
    name: libgodot (${{ matrix.goos }}/${{ matrix.goarch }}, ${{ matrix.libc || 'default' }}, ${{ matrix.variant }}${{ matrix.allow_fail && ', allow-fail' || '' }})
    needs: [matrix, bootstrap]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_fail == true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # Reuse the ~/gd cache the bootstrap job primed above. Key format
      # matches gdnext.yml so both workflows can share cache slots.
      # restore-keys fallback tolerates catalog additions between the
      # bootstrap step and this restore (e.g. a new optional tool
      # added mid-run); the buildroot SDK is fetched on demand
      # by `gdnext libgodot build` regardless.
      - id: tools-key
        shell: bash
        run: |
          digest=$(gdnext toolchain list --format json | sha256sum | cut -c1-12)
          echo "key=${{ runner.os }}-${{ runner.arch }}-gdnext-tools-${digest}" >> $GITHUB_OUTPUT
          echo "prefix=${{ runner.os }}-${{ runner.arch }}-gdnext-tools-" >> $GITHUB_OUTPUT
      - name: Restore ~/gd
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ steps.tools-key.outputs.key }}
          restore-keys: |
            ${{ steps.tools-key.outputs.prefix }}

      - name: Install scons
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            python3 -m pip install --break-system-packages --upgrade "scons>=4.4"
          else
            python3 -m pip install --upgrade "scons>=4.4"
          fi
          scons --version

      # System headers scons needs for the linuxbsd platform driver
      # (xkbcommon / wayland / x11 dev headers). Only relevant when the
      # matrix cell targets linuxbsd; a cross-compiled windows build
      # doesn't need them, but they're cheap on ubuntu runners.
      - name: apt linuxbsd build deps
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev \
            libglu1-mesa-dev git

      # Godot's windows recipe uses real mingw-w64 gcc (matching upstream
      # Godot's own CI). Zig-cc was tried as an alternative but trips
      # Godot's detect.py clang-detection path and cascades into
      # -Wa,-mbig-obj / windres failures. Real mingw-w64 sidesteps
      # all of it. Only relevant on ubuntu cross-hosting windows.
      #
      # ubuntu-24.04 ships both win32-thread and posix-thread mingw
      # variants; Godot's platform/windows/detect.py refuses to build
      # against win32 threads. Switch the update-alternatives symlinks
      # to point at the posix variant before scons runs.
      - name: apt mingw-w64 (windows cross)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends mingw-w64
          arch=x86_64
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            arch=aarch64
          fi
          for tool in gcc g++; do
            sudo update-alternatives --set "${arch}-w64-mingw32-${tool}" "/usr/bin/${arch}-w64-mingw32-${tool}-posix" || true
          done

      # setup-emsdk exports EMSDK / PATH into $GITHUB_ENV so scons finds emcc.
      - name: Setup Emscripten (web)
        if: matrix.goos == 'js'
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      # Mirrors upstream Godot's misc/scripts/install_vulkan_sdk_macos.sh;
      # provides MoltenVK so platform/macos/detect.py finds it via VULKAN_SDK.
      - name: Install Vulkan SDK (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip" -o /tmp/vulkan-sdk.zip
          unzip -q /tmp/vulkan-sdk.zip -d /tmp/vulkan-sdk
          installer=$(find /tmp/vulkan-sdk -name InstallVulkan.app -maxdepth 4 -print -quit)
          sudo "$installer/Contents/MacOS/InstallVulkan" \
            --root "$HOME/VulkanSDK/latest" \
            --accept-licenses --default-answer --confirm-command install \
            com.lunarg.vulkan.core com.lunarg.vulkan.usr
          rm -rf /tmp/vulkan-sdk /tmp/vulkan-sdk.zip
          echo "VULKAN_SDK=$HOME/VulkanSDK/latest/macOS" >> $GITHUB_ENV

      - id: build
        name: Build libgodot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          args=(--goos "${{ matrix.goos }}" --goarch "${{ matrix.goarch }}")
          if [ -n "${{ matrix.libc }}" ]; then
            args+=(--libc "${{ matrix.libc }}")
          fi
          if [ "${{ matrix.editor }}" = "true" ]; then
            args+=(--editor)
          fi
          gdnext libgodot build "${args[@]}"
          ref=$(gdnext libgodot version)
          src="$HOME/gd/godot-src/$ref/bin/${{ matrix.artefact }}"
          dst="$PWD/out/${{ matrix.install }}"
          cp "$src" "$dst"
          ( cd out && sha256sum "${{ matrix.install }}" > "${{ matrix.install }}.sha256" )
          ls -lah out

      - name: Upload artefact
        # Allow-fail cells never produce an artefact; skip the upload
        # so continue-on-error can properly mark the job as
        # "failed-but-tolerated" without a spurious upload-artefact
        # failure on top. `if: success()` guards on build step
        # outcome so a failed build cell skips upload naturally.
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libgodot-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.libc || 'default' }}-${{ matrix.variant }}
          path: |
            out/${{ matrix.install }}
            out/${{ matrix.install }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish libgodot release
    needs: build
    if: startsWith(github.ref, 'refs/tags/libgodot-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download every libgodot artefact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: libgodot-*
          path: release
          merge-multiple: true
      - name: Show release payload
        shell: bash
        run: |
          find release -type f | sort
          ( cd release && sha256sum * | tee CHECKSUMS.txt )
      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            libgodot static libraries built from godotengine/godot @ ${{ github.ref_name }}.

            Consumed by graphics.gd via `product.ToolchainLibGodot{,Editor}`. See
            docs/toolchains.md for the download + verify pipeline.
          files: |
            release/*
          fail_on_unmatched_files: true
