name: libgodot

# Manual runs (workflow_dispatch) build the matrix and upload every
# artefact as a run artifact for inspection. Tag pushes like
# `libgodot-v4.7-stable-1` also build the matrix and additionally
# publish everything to a GitHub Release the toolchain catalog can
# point at from ToolchainLibGodot.DownloadURL.
#
# The matrix itself is generated by `gdnext ci libgodot-matrix` from
# product.LibGodotMatrix — adding a recipe there lands in CI with zero
# workflow edits. Filters (--filter-target, --filter-libc, editor/
# template only) let workflow_dispatch runs iterate on subsets.
on:
  workflow_dispatch:
    inputs:
      filter-target:
        description: "Comma-separated goos/goarch to build (empty = all)"
        required: false
        default: ""
      filter-libc:
        description: "Comma-separated libc variants glibc,musl (empty = both)"
        required: false
        default: ""
      variant:
        description: "Which variant(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - template
          - editor
  push:
    tags:
      - "libgodot-v*"

concurrency:
  group: libgodot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - id: gen
        name: Emit libgodot matrix
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.filter-target }}" ]; then
            args+=(--filter-target "${{ inputs.filter-target }}")
          fi
          if [ -n "${{ inputs.filter-libc }}" ]; then
            args+=(--filter-libc "${{ inputs.filter-libc }}")
          fi
          case "${{ inputs.variant }}" in
            editor)   args+=(--editor-only) ;;
            template) args+=(--template-only) ;;
          esac
          matrix_json=$(gdnext ci libgodot-matrix --summary "${args[@]}" 2>matrix.log)
          cat matrix.log >&2
          echo "include=$(echo "$matrix_json" | jq -c '.include')" >> $GITHUB_OUTPUT

  build:
    name: libgodot (${{ matrix.goos }}/${{ matrix.goarch }}, ${{ matrix.libc || 'default' }}, ${{ matrix.variant }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # zig serves the cross-compilers for windows-mingw and the
      # libgodot musl variant on linux; buildroot glibc has its own
      # SDK pulled in on demand by `gdnext libgodot build --libc=glibc`.
      - name: Toolchain doctor (zig)
        shell: bash
        run: gdnext toolchain install zig

      - name: Install scons
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            python3 -m pip install --break-system-packages --upgrade "scons>=4.4"
          else
            python3 -m pip install --upgrade "scons>=4.4"
          fi
          scons --version

      # System headers scons needs for the linuxbsd platform driver
      # (xkbcommon / wayland / x11 dev headers). Only relevant when the
      # matrix cell targets linuxbsd; a cross-compiled windows build
      # doesn't need them, but they're cheap on ubuntu runners.
      - name: apt linuxbsd build deps
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev \
            libglu1-mesa-dev git

      - id: build
        name: Build libgodot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          args=(--goos "${{ matrix.goos }}" --goarch "${{ matrix.goarch }}")
          if [ -n "${{ matrix.libc }}" ]; then
            args+=(--libc "${{ matrix.libc }}")
          fi
          if [ "${{ matrix.editor }}" = "true" ]; then
            args+=(--editor)
          fi
          gdnext libgodot build "${args[@]}"
          ref=$(gdnext libgodot version)
          src="$HOME/gd/godot-src/$ref/bin/${{ matrix.artefact }}"
          dst="$PWD/out/${{ matrix.install }}"
          cp "$src" "$dst"
          ( cd out && sha256sum "${{ matrix.install }}" > "${{ matrix.install }}.sha256" )
          ls -lah out

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libgodot-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.libc || 'default' }}-${{ matrix.variant }}
          path: |
            out/${{ matrix.install }}
            out/${{ matrix.install }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish libgodot release
    needs: build
    if: startsWith(github.ref, 'refs/tags/libgodot-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download every libgodot artefact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: libgodot-*
          path: release
          merge-multiple: true
      - name: Show release payload
        shell: bash
        run: |
          find release -type f | sort
          ( cd release && sha256sum * | tee CHECKSUMS.txt )
      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            libgodot static libraries built from godotengine/godot @ ${{ github.ref_name }}.

            Consumed by graphics.gd via `product.ToolchainLibGodot{,Editor}`. See
            docs/toolchains.md for the download + verify pipeline.
          files: |
            release/*
          fail_on_unmatched_files: true
