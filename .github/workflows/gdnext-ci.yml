name: gdnext-ci

on:
  push:
    branches: ["release", "staging", "gdnext-cli"]
    paths:
      - "cmd/gdnext/**"
      - "cmd/gdnext-ci/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext-ci.yml"
  pull_request:
    branches: ["release"]
    paths:
      - "cmd/gdnext/**"
      - "cmd/gdnext-ci/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext-ci.yml"

jobs:
  # Pre-job: enumerate the supported build targets from product data.
  # The output drives the build matrix below, so adding a new row to
  # product.PlatformMatrix lands in CI with zero workflow edits.
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      experimental: ${{ steps.list.outputs.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # gdnext platforms is pure data + no toolchains, safe to `go run`.
          # Both filters reject ios + metaquest (need Apple certs / android
          # SDK respectively) and darwin/amd64 (folded into universal arm64).
          rows=$(go run ./cmd/gdnext platforms targets --format json)
          targets=$(jq -c '[ .[]
              | select(.status | test("supported|experimental"))
              | select(.status | test("broken") | not)
              | select(.goos != "ios" and .goos != "metaquest" and (.goos != "darwin" or .goarch != "amd64"))
              | "\(.goos)/\(.goarch)" ]' <<<"$rows")
          experimental=$(jq -c '[ .[]
              | select(.status | test("experimental"))
              | select(.goos != "ios" and .goos != "metaquest" and (.goos != "darwin" or .goarch != "amd64"))
              | "\(.goos)/\(.goarch)" ]' <<<"$rows")
          echo "targets=$targets" >> $GITHUB_OUTPUT
          echo "experimental=$experimental" >> $GITHUB_OUTPUT
          echo "CI build targets:"
          echo "$targets" | jq -r '.[]'
          echo
          echo "Experimental (continue-on-error):"
          echo "$experimental" | jq -r '.[]'

  gdnext-ci:
    needs: discover-targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        example: [canarybird]
        target: ${{ fromJSON(needs.discover-targets.outputs.targets) }}
        exclude:
          # darwin builds natively only — no zig cross-compile path.
          - {os: ubuntu-latest, target: darwin/arm64}
          - {os: windows-latest, target: darwin/arm64}
          # musl currently only supported on linux hosts.
          - {os: windows-latest, target: musl/amd64}
          - {os: macos-latest, target: musl/amd64}
          - {os: windows-latest, target: musl/arm64}
          - {os: macos-latest, target: musl/arm64}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Compute week key
        id: week
        shell: bash
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Resolve Godot export-templates dir
        id: templates
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "dir=$HOME/.local/share/godot/export_templates" >> $GITHUB_OUTPUT ;;
            macOS)   echo "dir=$HOME/Library/Application Support/Godot/export_templates" >> $GITHUB_OUTPUT ;;
            Windows) echo "dir=$APPDATA/Godot/export_templates" >> $GITHUB_OUTPUT ;;
          esac

      - name: Cache ~/gd and Godot export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/gd
            ${{ steps.templates.outputs.dir }}
          key: ${{ runner.os }}-gdnext-weekly-${{ steps.week.outputs.week }}
          restore-keys: ${{ runner.os }}-gdnext-weekly-

      - name: Install gdnext + gdnext-ci into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext ./cmd/gdnext-ci
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build + vet + unit tests
        shell: bash
        run: gdnext-ci build-vet-test

      - name: Help text smoke
        shell: bash
        run: gdnext-ci help-text

      - name: Diagnostic verbs (pre-install)
        shell: bash
        run: gdnext-ci diagnostic-verbs

      - name: Go passthrough
        shell: bash
        run: gdnext-ci go-passthrough

      - name: Short-flag rewrite
        shell: bash
        run: gdnext-ci short-flag-rewrite

      - name: Toolchain install (zig + godot)
        shell: bash
        run: gdnext-ci toolchain-install

      - name: Stage example (${{ matrix.example }})
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          echo "tmp=$tmp" >> $GITHUB_OUTPUT
          gdnext-ci stage-example --example "${{ matrix.example }}" --scratch "$tmp"

      # Build the matrix's target. (goos, goarch) is validated against
      # product.PlatformMatrix inside `gdnext-ci build-target`, so a
      # typo'd target fails with a clear "unknown platform" message
      # instead of a cryptic deeper error. Experimental targets carry
      # continue-on-error so the job stays green when they break —
      # the failure still shows up in the matrix UI as a yellow row.
      - name: Build ${{ matrix.target }}
        continue-on-error: ${{ contains(fromJSON(needs.discover-targets.outputs.experimental), matrix.target) }}
        shell: bash
        run: |
          IFS=/ read -r goos goarch <<< "${{ matrix.target }}"
          gdnext-ci build-target --goos "$goos" --goarch "$goarch" --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Headless test pipeline
        shell: bash
        run: gdnext-ci test-headless --scratch "${{ steps.stage.outputs.tmp }}"