name: gdnext-ci

on:
  push:
    branches: ["release", "staging", "gdnext-cli"]
    paths:
      - "cmd/gdnext/**"
      - "cmd/gdnext-ci/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext-ci.yml"
  pull_request:
    branches: ["release"]
    paths:
      - "cmd/gdnext/**"
      - "cmd/gdnext-ci/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext-ci.yml"

jobs:
  gdnext-ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        example: [canarybird]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.26"

      - name: Compute week key
        id: week
        shell: bash
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Resolve Godot export-templates dir
        id: templates
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "dir=$HOME/.local/share/godot/export_templates" >> $GITHUB_OUTPUT ;;
            macOS)   echo "dir=$HOME/Library/Application Support/Godot/export_templates" >> $GITHUB_OUTPUT ;;
            Windows) echo "dir=$APPDATA/Godot/export_templates" >> $GITHUB_OUTPUT ;;
          esac

      - name: Cache ~/gd and Godot export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/gd
            ${{ steps.templates.outputs.dir }}
          key: ${{ runner.os }}-gdnext-weekly-${{ steps.week.outputs.week }}
          restore-keys: ${{ runner.os }}-gdnext-weekly-

      - name: Install gdnext + gdnext-ci into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext ./cmd/gdnext-ci
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build + vet + unit tests
        shell: bash
        run: gdnext-ci build-vet-test

      - name: Help text smoke
        shell: bash
        run: gdnext-ci help-text

      - name: Diagnostic verbs (pre-install)
        shell: bash
        run: gdnext-ci diagnostic-verbs

      - name: Go passthrough
        shell: bash
        run: gdnext-ci go-passthrough

      - name: Short-flag rewrite
        shell: bash
        run: gdnext-ci short-flag-rewrite

      - name: Toolchain install (zig + godot)
        shell: bash
        run: gdnext-ci toolchain-install

      - name: Stage example (${{ matrix.example }})
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          echo "tmp=$tmp" >> $GITHUB_OUTPUT
          gdnext-ci stage-example --example "${{ matrix.example }}" --scratch "$tmp"

      # -------------------------------------------------------------------
      # Build matrix — each step is gated to the runners that can actually
      # produce the artefact. Every step runs `gdnext build` for real
      # (no RUNNING_INSIDE_GODOT short-circuit) so the full pipeline
      # templates.Assert → BuildMain → godot --headless --export-release
      # is exercised end-to-end. (goos, goarch) is validated against
      # product.PlatformMatrix inside `gdnext-ci build-target`, so a
      # typo'd target fails the step with a clear "unknown platform"
      # message instead of a cryptic deeper error.
      # -------------------------------------------------------------------

      - name: Build linux/amd64
        shell: bash
        run: gdnext-ci build-target --goos linux --goarch amd64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build linux/arm64 (ubuntu only — zig cross)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: gdnext-ci build-target --goos linux --goarch arm64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build windows/amd64
        shell: bash
        run: gdnext-ci build-target --goos windows --goarch amd64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build darwin/arm64 (macos only — universal, unsigned)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: gdnext-ci build-target --goos darwin --goarch arm64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build js/wasm
        shell: bash
        run: gdnext-ci build-target --goos js --goarch wasm --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build android/arm64
        shell: bash
        run: gdnext-ci build-target --goos android --goarch arm64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build android/amd64
        shell: bash
        run: gdnext-ci build-target --goos android --goarch amd64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Build musl/amd64 (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: gdnext-ci build-target --goos musl --goarch amd64 --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Headless test pipeline
        shell: bash
        run: gdnext-ci test-headless --scratch "${{ steps.stage.outputs.tmp }}"