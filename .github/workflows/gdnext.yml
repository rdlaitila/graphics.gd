name: gdnext

on:
  push:
    branches: ["release", "staging", "gdnext", "gdnext-cli"]
    paths:
      - "cmd/gdnext/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext.yml"
  pull_request:
    branches: ["release"]
    paths:
      - "cmd/gdnext/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext.yml"
  workflow_dispatch:
    inputs:
      filter-host:
        description: "Comma-separated <goos>/<goarch> host tuples (empty = all)"
        required: false
        default: ""
        type: string
      filter-target:
        description: "Comma-separated <goos>/<goarch> target tuples (empty = all)"
        required: false
        default: ""
        type: string

# Only one run per branch at a time. A new push cancels any in-flight
# run for the same ref so we don't burn runner-minutes on stale work.
concurrency:
  group: gdnext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-job: enumerate the supported build targets from product data.
  # `gdnext ci matrix` emits a fully-expanded include: list keyed by
  # (os, target, example, experimental); the build job consumes it via
  # fromJSON. Adding a new row to product.PlatformMatrix (or flipping
  # its BuildHosts) lands in CI with zero workflow edits.
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/gdnext
          matrix=$("$(go env GOPATH)/bin/gdnext" ci matrix --summary \
            --filter-host "${{ inputs.filter-host }}" \
            --filter-target "${{ inputs.filter-target }}")
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # CLI smoke checks that don't depend on (target, example). Runs
  # once per host OS instead of once per matrix cell.
  gdnext-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build + vet + unit tests
        shell: bash
        run: gdnext ci build-vet-test

      - name: Help text smoke
        shell: bash
        run: gdnext ci help-text

      - name: Diagnostic verbs (pre-install)
        shell: bash
        run: gdnext ci diagnostic-verbs

      - name: Go passthrough
        shell: bash
        run: gdnext ci go-passthrough

      - name: Short-flag rewrite
        shell: bash
        run: gdnext ci short-flag-rewrite

      - name: Toolchain install
        shell: bash
        # KnownChecksums is now seeded in product.Toolchain for every
        # tool CI downloads (godot, zig, llvm, the android tooling,
        # libgodot, libgodot-editor). Strict verification is the
        # default — set GDNEXT_SKIP_CHECKSUM=1 here only to bootstrap
        # a brand-new tool whose hash hasn't landed in the catalog yet.
        run: gdnext ci toolchain-install

      - name: Toolchain doctor (post-install)
        shell: bash
        run: gdnext toolchain doctor

      # Snapshot the downloaded-artefact hashes (sha256 + bytes + source URL)
      # captured by `gdnext toolchain install` into per-tool sidecars during
      # the step above. The workflow summary diffs against prior runs and
      # the SHA values feed product.Toolchain.KnownChecksums for supply-chain
      # verification. SHA alone identifies the artefact; size is
      # informational, source URL is informational provenance.
      - name: Toolchain audit snapshot
        shell: bash
        run: gdnext toolchain doctor --format=json | tee toolchain-audit.json
      - name: Upload toolchain audit (${{ runner.os }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-audit-${{ runner.os }}
          path: toolchain-audit.json
          if-no-files-found: error
          retention-days: 30

      # Hand the freshly-installed ~/gd off to the build matrix via a
      # per-SHA cache. The build job restores by the same key; the
      # cache is automatically scoped to the run's commit, so any code
      # change forces a clean install on the next push.
      - name: Cache ~/gd for the build matrix
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ runner.os }}-gdnext-${{ github.sha }}

  # Per-target build matrix. The matrix is supplied by discover-targets
  # as a fully-expanded include: list — host × target gating lives in
  # product.Platform.BuildHosts, not in the workflow.
  gdnext-build:
    needs: [discover-targets, gdnext-checks]
    # Pin the displayed name so the matrix axes (which include long
    # artefact slugs + boolean flags) don't leak into the UI label.
    name: gdnext-build (${{ matrix.os }}, ${{ matrix.example }}, ${{ matrix.target }}, ${{ matrix.link }}${{ matrix.experimental && ', exp' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Restore ~/gd from the checks job
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ runner.os }}-gdnext-${{ github.sha }}

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Stage example (${{ matrix.example }})
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          # Use RUNNER_TEMP so the path is visible to Node-based
          # actions (upload-artifact). $(mktemp -d) on Git-Bash
          # returns a mingw /tmp/... path that the Node host can't see.
          # Stage into a subdir named after the example so the staged
          # working directory's basename matches the example name —
          # several builders derive project.Name from filepath.Base(wd)
          # and Godot's export presets are keyed on the example name.
          tmp="${RUNNER_TEMP//\\//}/${{ matrix.example }}"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          echo "tmp=$tmp" >> $GITHUB_OUTPUT
          gdnext ci stage-example --example "${{ matrix.example }}" --scratch "$tmp"

      # `rename darwin_<arch>.dylib~ darwin_<arch>.dylib: Access is
      # denied` keeps surfacing on windows-latest. Defender's
      # WdFilter minifilter cannot be detached from CI (Tamper
      # Protection blocks every disable lever short of the runner
      # being a different image). So we layer the cheap mitigations
      # here — path / process / extension exclusions, realtime off,
      # WSearch stop — and rely on a single-shot retry inside the
      # macOS builder for the residual rename race. Best-effort,
      # Windows-only.
      - name: Disable Windows Defender on build dirs
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $paths = @(
            '${{ steps.stage.outputs.tmp }}',
            "$env:USERPROFILE\gd",
            "$env:USERPROFILE\go",
            "$env:LOCALAPPDATA\go-build",
            "$env:LOCALAPPDATA\Temp",
            "$env:TEMP",
            'C:\hostedtoolcache\windows\go',
            '${{ github.workspace }}',
            'D:\a'
          )
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { Write-Host "skip path $p : $_" }
          }
          $procs = @(
            'link.exe','go.exe','zig.exe','compile.exe','cgo.exe',
            'gdnext.exe','godot.exe','cc.exe','clang.exe','clang++.exe',
            'ld.exe','asm.exe'
          )
          foreach ($proc in $procs) {
            try { Add-MpPreference -ExclusionProcess $proc -ErrorAction Stop } catch { Write-Host "skip proc $proc : $_" }
          }
          $exts = @('dylib','so','dll','a','lib','wasm','exe','tmp')
          foreach ($ext in $exts) {
            try { Add-MpPreference -ExclusionExtension $ext -ErrorAction Stop } catch { Write-Host "skip ext $ext : $_" }
          }
          # Heavy hammer: turn the engine itself off. windows-latest
          # ships with Tamper Protection disabled, so this is allowed.
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction Stop
            Set-MpPreference -DisableIOAVProtection $true -ErrorAction Stop
            Set-MpPreference -DisableScriptScanning $true -ErrorAction Stop
            Set-MpPreference -DisableArchiveScanning $true -ErrorAction Stop
            Write-Host "Defender realtime/behaviour/IOAV scanning disabled"
          } catch {
            Write-Host "Set-MpPreference failed: $_"
          }
          # WSearch keeps file handles open on freshly written files
          # while it indexes; same symptom as Defender.
          try {
            Stop-Service -Name WSearch -Force -ErrorAction Stop
            Set-Service -Name WSearch -StartupType Disabled -ErrorAction Stop
            Write-Host "WSearch indexer stopped"
          } catch {
            Write-Host "WSearch stop failed: $_"
          }
          Write-Host "--- Get-MpPreference summary ---"
          Get-MpComputerStatus | Format-List RealTimeProtectionEnabled,BehaviorMonitorEnabled,IoavProtectionEnabled,AntivirusEnabled
          Write-Host "--- exclusion paths ---"
          (Get-MpPreference).ExclusionPath
          Write-Host "--- exclusion processes ---"
          (Get-MpPreference).ExclusionProcess
          Write-Host "--- exclusion extensions ---"
          (Get-MpPreference).ExclusionExtension

      # Confirm the cache restore brought ~/gd in fully. --fix runs
      # install for whatever's missing, so a cold cache still works
      # (just slower) and a stale cache self-heals.
      - name: Toolchain doctor
        shell: bash
        run: gdnext toolchain doctor --fix

      # gsudo elevates the build on Windows. The job process runs as
      # 'runneradmin' but unelevated (UAC split token), and Defender's
      # WdFilter intercepts link.exe's `<out>~` -> `<out>` rename in
      # that token. Running the build elevated lets us probe whether
      # the rename succeeds with admin privileges; if it still fails
      # we can extend this step to fltmc-detach WdFilter from D:
      # before invoking gdnext.
      - name: Install gsudo
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y gsudo --no-progress

      # Build the matrix's target. (goos, goarch) is validated against
      # product.PlatformMatrix inside `gdnext ci build-target`, so a
      # typo'd target fails with a clear "unknown platform" message
      # instead of a cryptic deeper error. Experimental targets carry
      # continue-on-error so the job stays green when they break —
      # the failure still shows up in the matrix UI as a yellow row.
      - name: Build ${{ matrix.target }} [${{ matrix.link || 'default' }}]${{ matrix.experimental && ' (experimental)' || '' }}
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        run: |
          IFS=/ read -r goos goarch <<< "${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            gsudo --loglevel none -- gdnext ci build-target --goos "$goos" --goarch "$goarch" --link "${{ matrix.link }}" --scratch "${{ steps.stage.outputs.tmp }}"
          else
            gdnext ci build-target --goos "$goos" --goarch "$goarch" --link "${{ matrix.link }}" --scratch "${{ steps.stage.outputs.tmp }}"
          fi

      - name: Tree ${{ matrix.target }} [${{ matrix.link || 'default' }}]
        if: always()
        shell: bash
        run: |
          set -eu
          tmp="${{ steps.stage.outputs.tmp }}"
          echo "::group::file tree of $tmp"
          find "$tmp" \( -type f -o -type l \) | sort
          echo "::endgroup::"

      # Upload the staged scratch dir so the play matrix can download
      # and drive the produced binary. Only the cells whose target has
      # a Platform.PlayHosts entry contribute artefacts; the rest skip
      # this step entirely so we don't burn storage on builds nobody
      # can play yet.
      - name: Upload play artefact (${{ matrix.artifact }})
        if: ${{ matrix.playable && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.stage.outputs.tmp }}
          if-no-files-found: error
          retention-days: 1

      - name: Headless test pipeline
        shell: bash
        run: gdnext ci test-headless --scratch "${{ steps.stage.outputs.tmp }}"

  # Pre-job: enumerate the (play-host, build-host, target, link) quads
  # the play matrix should drive. Only emitted for Platforms whose
  # PlayHosts is non-empty, so adding a play target lands here without
  # workflow edits.
  discover-plays:
    needs: [gdnext-build]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      empty: ${{ steps.list.outputs.empty }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/gdnext
          matrix=$("$(go env GOPATH)/bin/gdnext" ci play-matrix --summary \
            --filter-host "${{ inputs.filter-host }}" \
            --filter-target "${{ inputs.filter-target }}")
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          # Skip the gdnext-play job entirely when no rows exist
          # (e.g. every play target was excluded). Otherwise GHA
          # complains about an empty matrix.
          count=$(echo "$matrix" | jq '.include | length')
          if [ "$count" = "0" ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
          fi

  # Per-(play-host, build-host, target, link) drive of the produced
  # binary via the canarybird play-bot. Each cell downloads its build
  # artefact, runs `gdnext ci play-cell` against it, and surfaces the
  # bot's pass/fail report.
  gdnext-play:
    needs: [discover-plays]
    if: ${{ always() && needs.discover-plays.outputs.empty == 'false' }}
    name: gdnext-play (${{ matrix.os }}, ${{ matrix.build_os }}, ${{ matrix.example }}, ${{ matrix.target }}, ${{ matrix.link }}${{ matrix.experimental && ', exp' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-plays.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Download play artefact (${{ matrix.artifact }})
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: scratch

      # xvfb-run gives the engine a virtual display; wine lets linux
      # runners drive windows binaries. Both are no-ops when not
      # needed (play-cell short-circuits xvfb when $DISPLAY is set).
      - name: Install xvfb + wine
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb
          if [ "${{ matrix.target }}" = "windows/amd64" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends wine wine64
          fi

      - name: Play ${{ matrix.target }} [${{ matrix.link || 'default' }}] (built on ${{ matrix.build_os }})
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        run: |
          gdnext ci play-cell \
            --scratch scratch \
            --example "${{ matrix.example }}" \
            --target "${{ matrix.target }}" \
            --link "${{ matrix.link }}"

      - name: Show play report
        if: always()
        shell: bash
        run: |
          if [ -f scratch/play-report.json ]; then
            echo "::group::play-report.json"
            cat scratch/play-report.json
            echo "::endgroup::"
          else
            echo "no play-report.json"
          fi

      # Per-cell screenshot grabbed by the playbot at game-over. The
      # artefact name encodes both the play host (`matrix.os`) and the
      # build artefact (which already carries build host + example +
      # target + link) so every distinct cell uploads to its own slot.
      # Without `matrix.os` in the name, multiple play hosts driving
      # the same build artefact would overwrite each other's image.
      - name: Upload play screenshot
        if: always() && hashFiles('scratch/play-screenshot.png') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shot-${{ matrix.os }}-${{ matrix.artifact }}
          path: scratch/play-screenshot.png
          if-no-files-found: warn
          retention-days: 7

  # Aggregate every cell of this run plus the last 14 runs of this
  # branch into a single markdown step summary so the workflow's
  # success / failure history is visible at a glance from the UI.
  summary:
    name: Workflow summary
    needs: [discover-targets, gdnext-checks, gdnext-build, discover-plays, gdnext-play]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the screenshots orphan-branch push (workflow_sum_shots_push.go)
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install gdnext
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      # Pull every play-cell's screenshot into shots/<artefact>/play-screenshot.png
      # so the summary verb can inline them in a markdown grid.
      - name: Download play screenshots
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: shot-*
          path: shots
      - name: Render workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gdnext ci workflow-summary \
            --repo "${{ github.repository }}" \
            --workflow gdnext.yml \
            --branch "${{ github.ref_name }}" \
            --runs 14 \
            --shots shots \
            --shots-branch screenshots \
            --shots-run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"