name: gdnext

on:
  push:
    branches: ["release", "staging", "gdnext", "gdnext-cli"]
    paths:
      - "cmd/gdnext/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext.yml"
  pull_request:
    branches: ["release"]
    paths:
      - "cmd/gdnext/**"
      - "examples/**"
      - "product/**"
      - ".github/workflows/gdnext.yml"
  workflow_dispatch:
    inputs:
      filter-host:
        description: "Comma-separated <goos>/<goarch> host tuples (empty = all)"
        required: false
        default: ""
        type: string
      filter-target:
        description: "Comma-separated <goos>/<goarch> target tuples (empty = all)"
        required: false
        default: ""
        type: string
      filter-link:
        description: "Comma-separated link modes (gdextension|libgodot; empty = all)"
        required: false
        default: ""
        type: string

# Only one run per branch at a time. A new push cancels any in-flight
# run for the same ref so we don't burn runner-minutes on stale work.
concurrency:
  group: gdnext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-job: enumerate the supported build targets from product data.
  # `gdnext ci build-matrix` emits a fully-expanded include: list keyed by
  # (os, target, example, experimental); the build job consumes it via
  # fromJSON. Adding a new row to product.PlatformMatrix (or flipping
  # its BuildHosts) lands in CI with zero workflow edits.
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      runners: ${{ steps.list.outputs.runners }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/gdnext
          matrix=$("$(go env GOPATH)/bin/gdnext" ci build-matrix --summary \
            --filter-host "${{ inputs.filter-host }}" \
            --filter-target "${{ inputs.filter-target }}" \
            --filter-link "${{ inputs.filter-link }}")
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          # Derive the distinct runner labels appearing in the build
          # matrix so gdnext-checks only runs on hosts that survived
          # the filter. jq -c keeps the output a one-line JSON array
          # ready for fromJSON in the consuming job.
          runners=$(echo "$matrix" | jq -c '[.include[].os] | unique')
          echo "runners=$runners" >> $GITHUB_OUTPUT

  # CLI smoke checks that don't depend on (target, example). Runs
  # once per host OS the build matrix actually uses, so
  # --filter-host=windows/amd64 skips ubuntu + macos checks instead
  # of wasting a slot each.
  gdnext-checks:
    needs: [discover-targets]
    if: needs.discover-targets.outputs.runners != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.discover-targets.outputs.runners) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build + vet + unit tests
        shell: bash
        run: gdnext ci check-build-vet-test

      - name: Help text smoke
        shell: bash
        run: gdnext ci check-help-text

      - name: Diagnostic verbs (pre-install)
        shell: bash
        run: gdnext ci check-diagnostic-verbs

      - name: Go passthrough
        shell: bash
        run: gdnext ci check-go-passthrough

      - name: Short-flag rewrite
        shell: bash
        run: gdnext ci check-short-flag-rewrite

      - name: Toolchain install
        shell: bash
        # KnownChecksums is now seeded in product.Toolchain for every
        # tool CI downloads (godot, zig, llvm, the android tooling,
        # libgodot, libgodot-editor). Strict verification is the
        # default — set GDNEXT_SKIP_CHECKSUM=1 here only to bootstrap
        # a brand-new tool whose hash hasn't landed in the catalog yet.
        run: gdnext ci check-toolchain-install

      - name: Toolchain doctor (post-install)
        shell: bash
        run: gdnext toolchain doctor

      # Snapshot the downloaded-artefact hashes (sha256 + bytes + source URL)
      # captured by `gdnext toolchain install` into per-tool sidecars during
      # the step above. The workflow summary diffs against prior runs and
      # the SHA values feed product.Toolchain.KnownChecksums for supply-chain
      # verification. SHA alone identifies the artefact; size is
      # informational, source URL is informational provenance.
      - name: Toolchain audit snapshot
        shell: bash
        run: gdnext toolchain doctor --format=json | tee toolchain-audit.json
      - name: Upload toolchain audit (${{ runner.os }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-audit-${{ runner.os }}
          path: toolchain-audit.json
          if-no-files-found: error
          retention-days: 30

      # Hand the freshly-installed ~/gd off to the build matrix via a
      # per-SHA cache. The build job restores by the same key; the
      # cache is automatically scoped to the run's commit, so any code
      # change forces a clean install on the next push.
      - name: Cache ~/gd for the build matrix
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ runner.os }}-gdnext-${{ github.sha }}

  # Per-target build matrix. The matrix is supplied by discover-targets
  # as a fully-expanded include: list — host × target gating lives in
  # product.Platform.BuildHosts, not in the workflow.
  gdnext-build:
    needs: [discover-targets, gdnext-checks]
    # Pin the displayed name so the matrix axes (which include long
    # artefact slugs + boolean flags) don't leak into the UI label.
    name: gdnext-build (${{ matrix.os }}, ${{ matrix.example }}, ${{ matrix.target }}, ${{ matrix.link }}${{ matrix.allow_fail && ', allow-fail' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Restore ~/gd from the checks job
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/gd
          key: ${{ runner.os }}-gdnext-${{ github.sha }}

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Stage example (${{ matrix.example }})
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          # Use RUNNER_TEMP so the path is visible to Node-based
          # actions (upload-artifact). $(mktemp -d) on Git-Bash
          # returns a mingw /tmp/... path that the Node host can't see.
          # Stage into a subdir named after the example so the staged
          # working directory's basename matches the example name —
          # several builders derive project.Name from filepath.Base(wd)
          # and Godot's export presets are keyed on the example name.
          tmp="${RUNNER_TEMP//\\//}/${{ matrix.example }}"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          echo "tmp=$tmp" >> $GITHUB_OUTPUT
          gdnext ci build-stage-example --example "${{ matrix.example }}" --scratch "$tmp"

      # Confirm the cache restore brought ~/gd in fully. --fix runs
      # install for whatever's missing, so a cold cache still works
      # (just slower) and a stale cache self-heals.
      - name: Toolchain doctor
        shell: bash
        run: gdnext toolchain doctor --fix

      # Build the matrix's target. (goos, goarch) is validated against
      # product.PlatformMatrix inside `gdnext ci build-target`, so a
      # typo'd target fails with a clear "unknown platform" message
      # instead of a cryptic deeper error. allow-fail targets (set by
      # an experimental Status bit or a QuirkCIBuildBroken on the
      # current host) run with continue-on-error so the job stays
      # green when they break — GHA can't render the cell yellow, but
      # `gdnext ci workflow-summary` tags the row `(allow-fail)`.
      - name: Build ${{ matrix.target }} [${{ matrix.link || 'default' }}]${{ matrix.allow_fail && ' (allow-fail)' || '' }}
        continue-on-error: ${{ matrix.allow_fail }}
        shell: bash
        run: |
          IFS=/ read -r goos goarch <<< "${{ matrix.target }}"
          gdnext ci build-target --goos "$goos" --goarch "$goarch" --link "${{ matrix.link }}" --scratch "${{ steps.stage.outputs.tmp }}"

      - name: Tree ${{ matrix.target }} [${{ matrix.link || 'default' }}]
        if: always()
        shell: bash
        run: |
          set -eu
          tmp="${{ steps.stage.outputs.tmp }}"
          echo "::group::file tree of $tmp"
          find "$tmp" \( -type f -o -type l \) | sort
          echo "::endgroup::"

      # Upload the staged scratch dir so the play matrix can download
      # and drive the produced binary. Only the cells whose target has
      # a Platform.PlayHosts entry contribute artefacts; the rest skip
      # this step entirely so we don't burn storage on builds nobody
      # can play yet.
      - name: Upload play artefact (${{ matrix.artifact }})
        if: ${{ matrix.playable && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.stage.outputs.tmp }}
          if-no-files-found: error
          retention-days: 1

      - name: Headless test pipeline
        shell: bash
        run: gdnext ci build-test-headless --scratch "${{ steps.stage.outputs.tmp }}"

  # Pre-job: enumerate the (play-host, build-host, target, link) quads
  # the play matrix should drive. Only emitted for Platforms whose
  # PlayHosts is non-empty, so adding a play target lands here without
  # workflow edits.
  discover-plays:
    needs: [gdnext-build]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      matrix_android: ${{ steps.list.outputs.matrix_android }}
      empty: ${{ steps.list.outputs.empty }}
      empty_android: ${{ steps.list.outputs.empty_android }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/gdnext
          full=$("$(go env GOPATH)/bin/gdnext" ci play-matrix --summary \
            --filter-host "${{ inputs.filter-host }}" \
            --filter-target "${{ inputs.filter-target }}" \
            --filter-link "${{ inputs.filter-link }}")
          # Split the matrix into the regular (process-launched) cells
          # and the android-emu cells, which need a wholly different
          # job shape (the reactivecircus/android-emulator-runner
          # action wraps `gdnext ci play-cell` in its `script:` block
          # so adb + AVD are already provisioned by the time we run).
          matrix=$(echo "$full" | jq -c '{include: [.include[] | select(.compat != "android-emu")]}')
          matrix_android=$(echo "$full" | jq -c '{include: [.include[] | select(.compat == "android-emu")]}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "matrix_android=$matrix_android" >> $GITHUB_OUTPUT
          # Skip each downstream job when its slice is empty so GHA
          # doesn't complain about an empty matrix.
          count=$(echo "$matrix" | jq '.include | length')
          if [ "$count" = "0" ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
          fi
          count_android=$(echo "$matrix_android" | jq '.include | length')
          if [ "$count_android" = "0" ]; then
            echo "empty_android=true" >> $GITHUB_OUTPUT
          else
            echo "empty_android=false" >> $GITHUB_OUTPUT
          fi

  # Per-(play-host, build-host, target, link) drive of the produced
  # binary via the canarybird play-bot. Each cell downloads its build
  # artefact, runs `gdnext ci play-cell` against it, and surfaces the
  # bot's pass/fail report.
  gdnext-play:
    needs: [discover-plays]
    if: ${{ always() && needs.discover-plays.outputs.empty == 'false' }}
    name: gdnext-play (${{ matrix.os }}, ${{ matrix.build_os }}, ${{ matrix.example }}, ${{ matrix.target }}, ${{ matrix.link }}, ${{ matrix.compat || 'native' }}${{ matrix.allow_fail && ', allow-fail' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-plays.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Download play artefact (${{ matrix.artifact }})
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: scratch

      # xvfb-run gives the engine a virtual display; wine and proton
      # (via umu-launcher) let linux runners drive windows binaries.
      # Compat-layer choice comes from the matrix. proton_tag is the
      # pinned GE-Proton release for proton variants; the install step
      # fetches the tarball when the cache misses.
      - name: Restore Proton (${{ matrix.proton_tag }})
        if: runner.os == 'Linux' && matrix.proton_tag != ''
        id: restore-proton
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/Steam/compatibilitytools.d/${{ matrix.proton_tag }}
          key: proton-${{ matrix.proton_tag }}-v1

      - name: Restore umu runtime cache
        if: runner.os == 'Linux' && matrix.proton_tag != ''
        id: restore-umu
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/umu
          key: umu-runtime-v1

      - name: Install xvfb + compat layer (${{ matrix.compat || 'native' }})
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb
          case "${{ matrix.compat }}" in
            wine)
              # Ubuntu noble ships Wine 9.0 which segfaults on first
              # launch of Godot/cgo apps. Use the WineHQ stable repo
              # (Wine 10.x) instead.
              sudo dpkg --add-architecture i386
              sudo mkdir -pm755 /etc/apt/keyrings
              sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
              sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
              sudo apt-get update -y
              sudo apt-get install -y --install-recommends winehq-stable
              ;;
            proton|proton-8|proton-9|proton-10)
              # umu-launcher isn't on PyPI; install the upstream
              # ubuntu-noble .deb published with each tagged release.
              # The .deb depends on libgl1-mesa-dri:i386 + libglx-mesa0:i386,
              # so the i386 architecture has to be enabled before apt
              # can resolve them.
              sudo dpkg --add-architecture i386
              sudo apt-get update -y
              # umu/Proton runs games inside pressure-vessel, which
              # uses bwrap to set up a user-namespace container.
              # Ubuntu 24.04 ships AppArmor profiles that block
              # unprivileged user namespaces; without relaxing those
              # bwrap fails with 'setting up uid map: Permission
              # denied'. The runner has sudo so we flip both knobs.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
              sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
              umu_ver="1.4.0"
              umu_deb="python3-umu-launcher_${umu_ver}-1_amd64_ubuntu-noble.deb"
              umu_url="https://github.com/Open-Wine-Components/umu-launcher/releases/download/${umu_ver}/${umu_deb}"
              if ! command -v umu-run >/dev/null 2>&1; then
                echo "::group::install umu-launcher ${umu_ver}"
                tmp=$(mktemp -d)
                curl -fsSL -o "$tmp/${umu_deb}" "$umu_url"
                sudo apt-get install -y "$tmp/${umu_deb}"
                rm -rf "$tmp"
                echo "::endgroup::"
              fi
              # Fetch the pinned GE-Proton tarball only when the cache
              # missed; otherwise the restore step already populated it.
              compat_dir="$HOME/.local/share/Steam/compatibilitytools.d"
              tag="${{ matrix.proton_tag }}"
              mkdir -p "$compat_dir"
              if [ ! -d "$compat_dir/$tag" ]; then
                echo "::group::download $tag"
                url="https://github.com/GloriousEggroll/proton-ge-custom/releases/download/$tag/$tag.tar.gz"
                tmp=$(mktemp -d)
                curl -fsSL -o "$tmp/proton.tar.gz" "$url"
                tar -xzf "$tmp/proton.tar.gz" -C "$compat_dir"
                rm -rf "$tmp"
                echo "::endgroup::"
              else
                echo "$tag already present (cache hit)"
              fi
              ;;
            chrome|firefox)
              # js/wasm cells run the bundle in a real browser driven
              # by Playwright. node is already on the runner image;
              # we install playwright into scratch/ (the same dir
              # the bundle was staged into so the script can resolve
              # it as a sibling node_modules), then `playwright
              # install --with-deps <browser>` pulls the matched
              # browser build + apt libs. We map our matrix `compat`
              # to Playwright's browser name explicitly: `chrome`
              # means the bundled chromium build (not Google Chrome
              # the channel, which would apt-install a separate
              # google-chrome-stable).
              case "${{ matrix.compat }}" in
                chrome) pw_browser="chromium" ;;
                firefox) pw_browser="firefox" ;;
              esac
              echo "::group::install playwright + ${pw_browser}"
              ( cd scratch && npm init -y >/dev/null && npm install --no-audit --no-fund playwright )
              ( cd scratch && npx playwright install --with-deps "${pw_browser}" )
              echo "::endgroup::"
              ;;
          esac

      - name: Save Proton (${{ matrix.proton_tag }})
        if: runner.os == 'Linux' && matrix.proton_tag != '' && steps.restore-proton.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/Steam/compatibilitytools.d/${{ matrix.proton_tag }}
          key: proton-${{ matrix.proton_tag }}-v1

      - name: Play ${{ matrix.target }} [${{ matrix.link || 'default' }}] compat=${{ matrix.compat || 'native' }} (built on ${{ matrix.build_os }})
        continue-on-error: ${{ matrix.allow_fail }}
        shell: bash
        run: |
          gdnext ci play-cell \
            --scratch scratch \
            --example "${{ matrix.example }}" \
            --target "${{ matrix.target }}" \
            --link "${{ matrix.link }}" \
            --compat "${{ matrix.compat }}" \
            --build-host "${{ matrix.build_os }}"

      - name: Save umu runtime cache
        if: runner.os == 'Linux' && matrix.proton_tag != '' && always() && steps.restore-umu.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/umu
          key: umu-runtime-v1

      - name: Show play report
        if: always()
        shell: bash
        run: |
          if [ -f scratch/play-report.json ]; then
            echo "::group::play-report.json"
            cat scratch/play-report.json
            echo "::endgroup::"
          else
            echo "no play-report.json"
          fi

      # Per-cell screenshot grabbed by the playbot at game-over. The
      # artefact name encodes the play host, the build artefact (which
      # carries build host + example + target + link), and the compat
      # layer when one is set. Without those axes, cells driving the
      # same build artefact through different layers would overwrite
      # each other.
      - name: Upload play screenshot
        if: always() && hashFiles('scratch/play-screenshot.png') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shot-${{ matrix.os }}-${{ matrix.artifact }}${{ matrix.compat && format('-{0}', matrix.compat) || '' }}
          path: scratch/play-screenshot.png
          if-no-files-found: warn
          retention-days: 7

  # Android emulator drive of the produced APK. Each cell consumes
  # the same build artefact the process-launched cells do, but boots
  # an x86_64 google_apis AVD via reactivecircus/android-emulator-runner
  # before handing control to `gdnext ci play-cell`. The action's
  # script: block inherits adb + the SDK environment, so the play
  # dispatcher can install, push the HUD, launch, poll, and pull
  # via standard adb verbs.
  gdnext-play-android:
    needs: [discover-plays]
    if: ${{ always() && needs.discover-plays.outputs.empty_android == 'false' }}
    name: gdnext-play-android (${{ matrix.build_os }}, ${{ matrix.example }}, ${{ matrix.target }}, ${{ matrix.link }}${{ matrix.allow_fail && ', allow-fail' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-plays.outputs.matrix_android) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install gdnext into PATH
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Download play artefact (${{ matrix.artifact }})
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: scratch

      # The x86_64 AVD only runs at usable speed with KVM. GitHub
      # Linux runners are KVM-capable but /dev/kvm isn't world
      # accessible by default; mirror upstream's go.yml setup.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play ${{ matrix.target }} [${{ matrix.link || 'default' }}] compat=android-emu (built on ${{ matrix.build_os }})
        continue-on-error: ${{ matrix.allow_fail }}
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            gdnext ci play-cell \
              --scratch scratch \
              --example "${{ matrix.example }}" \
              --target "${{ matrix.target }}" \
              --link "${{ matrix.link }}" \
              --compat android-emu \
              --build-host "${{ matrix.build_os }}"

      - name: Show play report
        if: always()
        shell: bash
        run: |
          if [ -f scratch/play-report.json ]; then
            echo "::group::play-report.json"
            cat scratch/play-report.json
            echo "::endgroup::"
          else
            echo "no play-report.json"
          fi

      - name: Upload play screenshot
        if: always() && hashFiles('scratch/play-screenshot.png') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shot-${{ matrix.os }}-${{ matrix.artifact }}-android-emu
          path: scratch/play-screenshot.png
          if-no-files-found: warn
          retention-days: 7

  # Aggregate every cell of this run plus the last 14 runs of this
  # branch into a single markdown step summary so the workflow's
  # success / failure history is visible at a glance from the UI.
  summary:
    name: Workflow summary
    needs: [discover-targets, gdnext-checks, gdnext-build, discover-plays, gdnext-play, gdnext-play-android]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for the screenshots orphan-branch push (workflow_sum_shots_push.go)
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"
      - name: Install gdnext
        shell: bash
        run: |
          go install ./cmd/gdnext
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      # Pull every play-cell's screenshot into shots/<artefact>/play-screenshot.png
      # so the summary verb can inline them in a markdown grid.
      - name: Download play screenshots
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: shot-*
          path: shots
      - name: Render workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gdnext ci workflow-summary \
            --repo "${{ github.repository }}" \
            --workflow gdnext.yml \
            --branch "${{ github.ref_name }}" \
            --runs 14 \
            --shots shots \
            --shots-branch screenshots \
            --shots-run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"